[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tickerfoundry"
version = "0.5.0"
description = "Reproducible listed-equity valuation from your own LSEG Workspace session"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
astra = ["openai>=2.0,<3.0"]
lseg = ["lseg-data>=2.1.1,<2.2", "tzdata>=2025.1"]

[project.scripts]
tickerfoundry = "equity_workbench.cli:main"
equity-workbench = "equity_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["equity_workbench*"]

[tool.setuptools.package-data]
equity_workbench = ["resources/*"]
