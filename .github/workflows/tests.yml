name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic and mocked tests without credentials
        run: python -m unittest discover -s tests -v
      - name: Run the explicitly fictional demonstration
        run: python -m equity_workbench demo --out runs/ci-demo
      - name: Build the source archive
        run: python scripts/package_public.py --out dist/equity-research-workbench.zip
